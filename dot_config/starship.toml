# ─── Claude Code statusline ──────────────────────────────────────────────
# Rendered via `starship statusline claude-code`, invoked in turn by
# ~/.claude/statusline-wrapper.sh. The wrapper tees CC's stdin JSON to
# starship for this render, and separately appends the Claude.ai 5-hour
# rate-limit % (a field starship's built-in modules don't expose). $claude_cost
# was removed per request — cost is no longer shown.
# $directory / $git_branch reuse your existing prompt styling.
[profiles]
claude-code = "$claude_model${env_var.CLAUDE_EFFORT}$directory$git_branch$claude_context"

# Starship has no effort module. Claude Code exports CLAUDE_EFFORT into the
# statusline process, so read it straight from the environment — no subprocess.
#
# No `when` guard is needed: env_var renders nothing when the variable is unset
# and no `default` is configured. That matters because the default prompt format
# `$all` also expands `$env_var`, same as it expands `$custom` — an unguarded
# [custom.*] module leaks into the interactive shell prompt.
#
# CLAUDE_EFFORT is undocumented (observed in the statusline env, not published).
# If it ever goes away this silently disappears; the fallback is a custom module
# running `jq -r '.effortLevel' ~/.claude/settings.json`, gated on
# `when = 'test -n "$CLAUDE_CODE_SESSION_ID"'`.
[env_var.CLAUDE_EFFORT]
format = "[$symbol$env_value]($style) "
symbol = "󰓅 "
style = "bold cyan"

[claude_model]
format = "[$symbol$model]($style) "
symbol = "󰚩 "
style = "bold purple"

[claude_model.model_aliases]
"claude-opus-4-8" = "Opus4.8"
"claude-sonnet-5" = "Sonnet5"
"claude-haiku-4-5" = "Haiku4.5"

[claude_context]
format = "[$symbol$input_tokens/$total_tokens]($style) "
symbol = "󰧑 "

# Defaults hide the module below 30%. Show it always; escalate color with usage.
[[claude_context.display]]
threshold = 0.0
style = "bold green"
hidden = false

[[claude_context.display]]
threshold = 60.0
style = "bold yellow"
hidden = false

[[claude_context.display]]
threshold = 80.0
style = "bold red"
hidden = false